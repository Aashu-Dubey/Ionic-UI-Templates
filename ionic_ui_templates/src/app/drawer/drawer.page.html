<div>
  <ion-split-pane contentId="main-content">
    <ion-menu
      class="menu-type-reveal"
      style="--width: {{drawerWidth()}}px"
      side="start"
      menuId="main-menu"
      contentId="main-content"
      type="my-reveal"
      [maxEdgeStart]="viewportWidth()"
    >
      <div class="headerToolbar">
        <ion-avatar class="userImage" #userAvatar>
          <img
            src="assets/home/userImage.png"
            alt="User Image"
            decoding="async"
          />
        </ion-avatar>
        <div class="nameContainer">
          <ion-label class="userName">Chris Hemsworth</ion-label>
        </div>
      </div>
      <div class="divider"></div>
      <ion-content>
        <ion-list class="ion-no-padding">
          @for (p of appPages; track $index) {
            @let isActive = activeTab() === p.name;
            <ion-menu-toggle
              auto-hide="false"
              #drawerItemList
            >
              <ion-item
                class="drawerItem"
                lines="none"
                detail="false"
                routerDirection="root"
                [routerLink]="p.url ? [p.url] : undefined"
                (click)="onDrawerNavigate(p)"
              >
                <ion-item
                  class="drawerInnerItem"
                  [style.--width]="rowWidth() + 'px'"
                  [style.--background]="isActive ? 'rgba(33, 150, 243, 0.2)' : 'transparent'"
                  lines="none"
                />
                @if (!p.isAsset) {
                  <i
                    [style.color]="isActive ? 'rgb(33, 150, 243)' : 'var(--color-nearlyBlack)'"
                    class="material-icons icon-margin"
                  >
                    {{p.icon}}
                  </i>
                }
                @if (p.isAsset) {
                  <img
                    style="width: 24px; height: 24px"
                    class="icon-margin"
                    [class]="isActive ? 'imgTintBlue' : 'imgTintBlack'"
                    src="assets/home/supportIcon.png"
                    [alt]="p.name"
                    loading="lazy"
                    decoding="async"
                  />
                }
                <ion-label
                  style="font-weight: 500; font-size: 16px; margin-left: 8px"
                  [style.color]="isActive ? 'rgb(33, 150, 243)' : 'var(--color-nearlyBlack)'"
                  >{{p.name}}
                </ion-label>
              </ion-item>
            </ion-menu-toggle>
          }
        </ion-list>
      </ion-content>
      <div class="divider"></div>
      <ion-footer class="ion-no-border">
        <ion-toolbar class="ion-no-padding">
          <ion-item button="true" detail="false" lines="none">
            <ion-label class="sign-out-text">Sign Out</ion-label>
            <i class="material-icons colorRed">power_settings_new</i>
          </ion-item>
        </ion-toolbar>
      </ion-footer>
    </ion-menu>

    <ion-router-outlet id="main-content" />
  </ion-split-pane>

  <!-- Reference:- https://codepen.io/carlosriera/pen/qNgAEo/ -->
  <button
    style="position: absolute"
    class="menu menu--back5 ion-activatable"
    (click)="onMenuClick()"
    [hidden]="isSplitPane()"
    #menuIcon
  >
    <div class="menu__icon">
      <div class="menu__line menu__line--1"></div>
      <div class="menu__line menu__line--2"></div>
      <div class="menu__line menu__line--3"></div>
    </div>
    <ion-ripple-effect type="unbounded" />
  </button>
</div>
