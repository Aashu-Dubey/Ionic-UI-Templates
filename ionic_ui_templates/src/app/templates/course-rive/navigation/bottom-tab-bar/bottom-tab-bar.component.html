<div class="gradient-border">
  <ion-row class="tabs-container">
    @for (tab of tabItems(); track tab.id) {
      @let isActive = selectedTab().id === tab.id;
      <ion-col
        (click)="onIconPress(tab)"
      >
        <div class="active-indicator-container">
          <div
            class="active-indicator"
            [class.expand]="isActive"
          ></div>
        </div>
        @if (tab.show) {
          <canvas
            [style.opacity]="isActive ? 1 : 0.5"
            riv="icons"
            [artboard]="tab.artboard"
            width="36"
            height="36"
          >
            <riv-state-machine [name]="tab.stateMachine" play>
              <riv-input name="active" [value]="tab.status" />
            </riv-state-machine>
          </canvas>
        }
      </ion-col>
    }
  </ion-row>
</div>
