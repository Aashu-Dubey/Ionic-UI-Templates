<div class="side-menu">
  <ion-row class="header">
    <ion-icon class="user-icon" name="person-outline" />
    <ion-col>
      <ion-text class="font-body">Ashu</ion-text>
      <br />
      <ion-text class="user-profession font-subheadline">
        Software Engineer
      </ion-text>
    </ion-col>
  </ion-row>

  <div class="sections-container">
    <div class="menu-list-section">
      <ion-text class="browse-heading font-subheadline2">BROWSE</ion-text>
      <div class="menu-btn-list-container">
        @for (menu of menuItems(); track menu.id) {
          <cr-menu-row
            #menuItems
            [menu]="menu"
            (pressed)="onMenuItemPress(menu)"
          />
        }
      </div>
    </div>

    <div class="menu-list-section">
      <ion-text class="browse-heading font-subheadline2">HISTORY</ion-text>
      <div class="menu-btn-list-container">
        @for (menu of menuItems2(); track menu.id) {
          <cr-menu-row
            #menuItems2
            [menu]="menu"
            (pressed)="onMenuItemPress(menu)"
          />
        }
      </div>
    </div>
  </div>

  <div class="spacer"></div>
  <div>
    @if (platform.is('capacitor')) {
      <ion-item
        class="exit-btn"
        button="true"
        lines="none"
        detail="false"
        (click)="goBack()"
      >
        <ion-icon class="exit-icon" name="exit-outline" />
        <ion-text class="font-headline">Exit</ion-text>
      </ion-item>
    }

    <ion-item class="dark-mode-container" lines="none">
      @let darkModeItem = menuItems3()[0];
      <div class="icon-container">
        @if (darkModeItem.show) {
          <canvas
            riv="icons"
            [artboard]="darkModeItem.artboard"
            width="32"
            height="32"
          >
            <riv-state-machine [name]="darkModeItem.stateMachine" play>
              <riv-input name="active" [value]="darkModeItem.status" />
            </riv-state-machine>
          </canvas>
        }
      </div>
      <ion-toggle
        class="font-headline"
        justify="space-between"
        mode="ios"
        [checked]="isDarkMode()"
        (ionChange)="onDarkModeToggle($event)"
      >
        Dark Mode
      </ion-toggle>
    </ion-item>
  </div>
</div>
