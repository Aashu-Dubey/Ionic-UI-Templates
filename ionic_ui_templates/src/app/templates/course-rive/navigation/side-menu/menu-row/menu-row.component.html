<div>
  <div class="seperator"></div>
  <div
    class="menu-btn-bg"
    [style.width.px]="menu.id === 'Home' ? 272 : 0"
  ></div>

  <ion-row class="menu-btn-container" (click)="pressed.emit()">
    <div class="icon-container">
      @if (menu.show) {
        <canvas
          riv="icons"
          [artboard]="menu.artboard"
          width="32"
          height="32"
        >
          <riv-state-machine [name]="menu.stateMachine" play>
            <riv-input name="active" [value]="menu.status"></riv-input>
          </riv-state-machine>
        </canvas>
      }
    </div>
    <ion-text class="font-headline">{{ menu.id }}</ion-text>
  </ion-row>
</div>
