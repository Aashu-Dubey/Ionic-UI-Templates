<div class="screen-background"></div>

<!-- Side Menu -->
<cr-side-menu #sideMenu />

<cr-on-boarding
  #onBoarding
  (closeOnBoardingEvent)="showOnBoardingToggle()"
/>

<ion-content #mainContent>
  @let isHomeTab = selectedTab().id === tabItems[0].id;
  <div class="home-tab-container" [hidden]="!isHomeTab">
    <cr-content-view />
  </div>

  <div
    class="other-tabs"
    [style.display]="isHomeTab ? 'none' : 'flex'"
  >
    <ion-text class="font-title">
      {{selectedTab().artboard.toLowerCase()}}
    </ion-text>
  </div>
</ion-content>

<button #onBoardingBtn class="on-boarding-btn" (click)="showOnBoardingToggle()">
  <ion-icon name="person-outline" />
</button>

<!-- Menu button -->
<button #menuToggleBtn class="side-menu-button" (click)="onMenuToggle()">
  @if (showRiveMenuBtn()) {
    <canvas
      riv="menu_button"
      width="44"
      height="44"
    >
      <riv-state-machine name="State Machine" play>
        <riv-input name="isOpen" [value]="isMenuOpen()" />
      </riv-state-machine>
    </canvas>
  }
</button>

<!-- White background behind tab bar that partially shows the tab content -->
<div #tabWhiteBg class="tabs-white-underlay"></div>

<!-- Custom Tab -->
<cr-bottom-tab-bar
  #bottomTabs
  style="z-index: 2"
  [(selectedTab)]="selectedTab"
/>
